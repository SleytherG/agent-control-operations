; PHP production configuration for Render Free (512 MB)
memory_limit = 128M
max_execution_time = 30
max_input_time = 30
post_max_size = 8M
upload_max_filesize = 2M

; Opcache
opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 0

; Security
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; PostgreSQL
pdo_pgsql.max_persistent = 5
