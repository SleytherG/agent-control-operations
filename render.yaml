services:
  - type: web
    name: agenteflow
    runtime: docker
    region: sao
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: AgenteFlow
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          type: web
          name: agenteflow
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
        # Recommended: Supabase Session Pooler host for IPv4 connectivity
        # Get exact value from Supabase Dashboard → Database → Connection Pooling → Session mode
        # Example format (varies by project): aws-0-sa-east-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: TRUSTED_PROXIES
        value: "*"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: APP_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        sync: false
      - key: JWT_ISSUER
        sync: false
      - key: JWT_AUDIENCE
        sync: false
      - key: JWT_ACCESS_TTL
        value: "300"
      - key: JWT_ABSOLUTE_SESSION_TTL
        value: "28800"
      - key: REFRESH_PEPPER
        sync: false
      - key: PASSWORD_RESET_TTL_SECONDS
        value: "3600"
      - key: PASSWORD_RESET_TEMPORARY_LENGTH
        value: "16"
